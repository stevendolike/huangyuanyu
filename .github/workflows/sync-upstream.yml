name: Sync Upstream

on:
  schedule:
    - cron: '0 3 * * *'   # 每日 UTC 03:00 (香港 11:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream (jangviktor-web/huangyuanyu)
        run: |
          git remote add upstream https://github.com/jangviktor-web/huangyuanyu.git
          git fetch upstream

      - name: Rebase onto upstream (main)
        run: |
          git checkout main
          git rebase upstream/main   # fork 本地只有 workflow commit, 通常直接 fast-forward
          git push --force-with-lease origin main
